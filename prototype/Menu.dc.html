<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Heebo:wght@300;400;500;700;800&display=swap">
<style>
  body { margin:0; background:#0d0b0a; }
  * { box-sizing:border-box; }
  ::selection { background: rgba(236,48,19,.35); }
  :focus { outline:none; }
  :focus-visible { outline:2px solid #ff6a4d; outline-offset:3px; }
  ::-webkit-scrollbar { display:none; }
  @keyframes sheetUp { from { transform:translateY(24px); opacity:0 } to { transform:translateY(0); opacity:1 } }
  @keyframes fade { from { opacity:0 } to { opacity:1 } }
  @keyframes rise { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:translateY(0) } }
</style>
</helmet>

<div style="min-height:100vh;background:#0d0b0a;display:flex;justify-content:center;font-family:Heebo, Archivo, system-ui, sans-serif;color:#f6f1ec">
<div dir="{{ dir }}" style="width:100%;max-width:440px;min-height:100vh;background:#141110;position:relative;overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.6)">

  <sc-if value="{{ splashOpen }}" hint-placeholder-val="{{ true }}">
    <div style="position:fixed;inset:0;z-index:40;background:#0d0b0a;display:flex;flex-direction:column;align-items:center;justify-content:space-between;max-width:440px;margin:0 auto;padding:44px 28px 32px;animation:fade .3s ease">
      <div style="font-family:Archivo, sans-serif;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#8a7f78">Table {{ tableNo }} · Yefet 114</div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:22px;animation:rise .5s ease both">
        <img src="assets/logo.jpeg" alt="שיפודי אבו חביב" style="width:252px;height:252px;object-fit:contain;border-radius:24px;background:#000;padding:6px;box-shadow:0 24px 60px rgba(0,0,0,.7), 0 0 0 1px rgba(246,241,236,.12)">
        <p style="margin:0;text-align:center;font-size:17px;line-height:1.6;color:#cdc3bb;max-width:24ch;font-weight:300;text-wrap:pretty">{{ splashLine }}</p>
      </div>
      <div style="width:100%;display:flex;flex-direction:column;gap:12px">
        <div style="text-align:center;font-family:Archivo, sans-serif;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#8a7f78">Language · שפה · لغة</div>
        <div style="display:flex;gap:10px">
          <sc-for list="{{ langs }}" as="l" hint-placeholder-count="3">
            <button type="button" onClick="{{ l.pick }}" style="flex:1;appearance:none;cursor:pointer;border:1px solid rgba(246,241,236,.18);background:rgba(246,241,236,.05);color:#f6f1ec;border-radius:999px;padding:16px 8px;font-family:Heebo, sans-serif;font-weight:500;font-size:15px;min-height:56px;backdrop-filter:blur(6px)" style-hover="background:rgba(236,48,19,.18);border-color:rgba(236,48,19,.5)" style-active="background:rgba(236,48,19,.3)">{{ l.label }}</button>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>

  <div style="position:sticky;top:0;z-index:20;background:rgba(20,17,16,.86);backdrop-filter:blur(16px);border-bottom:1px solid rgba(246,241,236,.09)">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 10px">
      <div style="display:flex;align-items:center;gap:11px;min-width:0">
        <img src="assets/logo.jpeg" alt="" style="width:42px;height:42px;object-fit:contain;border-radius:12px;background:#000;flex:none;box-shadow:0 0 0 1px rgba(246,241,236,.15)">
        <div style="display:flex;flex-direction:column;min-width:0">
          <div style="font-weight:700;font-size:16px;line-height:1.15;white-space:nowrap">שיפודי אבו חביב</div>
          <div style="font-family:Archivo, sans-serif;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#8a7f78;white-space:nowrap">Table {{ tableNo }} · {{ hours }}</div>
        </div>
      </div>
      <div style="display:flex;gap:4px;background:rgba(246,241,236,.07);border-radius:999px;padding:3px">
        <sc-for list="{{ langs }}" as="l" hint-placeholder-count="3">
          <button type="button" onClick="{{ l.pick }}" style="{{ l.chipStyle }}">{{ l.short }}</button>
        </sc-for>
      </div>
    </div>
    <div style="display:flex;gap:8px;overflow-x:auto;padding:4px 18px 14px">
      <sc-for list="{{ cats }}" as="c" hint-placeholder-count="3">
        <button type="button" onClick="{{ c.pick }}" style="{{ c.tabStyle }}">{{ c.label }}</button>
      </sc-for>
    </div>
  </div>

  <div style="padding:22px 18px 6px">
    <h2 style="margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1">{{ catTitle }}</h2>
    <p style="margin:8px 0 0;font-size:14px;line-height:1.6;color:#a2968e;font-weight:300;max-width:36ch;text-wrap:pretty">{{ catBlurb }}</p>
  </div>

  <div style="padding:14px 18px 130px;display:flex;flex-direction:column;gap:14px">
    <sc-for list="{{ dishes }}" as="d" hint-placeholder-count="6">
      <button type="button" onClick="{{ d.open }}" style="appearance:none;text-align:start;cursor:pointer;border:1px solid rgba(246,241,236,.09);background:#1c1817;border-radius:20px;padding:10px;display:flex;gap:14px;align-items:stretch;font-family:Heebo, sans-serif;color:#f6f1ec;box-shadow:0 6px 20px rgba(0,0,0,.35)" style-hover="border-color:rgba(236,48,19,.45);background:#221d1b" style-active="transform:scale(.99)">
        <div style="{{ d.imgStyle }}"></div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding:6px 4px 6px 0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="font-weight:700;font-size:18px;line-height:1.2">{{ d.name }}</span>
            <span style="{{ d.tagStyle }}">{{ d.tag }}</span>
          </div>
          <div style="font-size:13px;line-height:1.5;color:#a2968e;font-weight:300;flex:1">{{ d.short }}</div>
          <div style="font-family:Archivo, sans-serif;font-weight:600;font-size:16px;color:#ff7a5e">{{ d.price }}</div>
        </div>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{ dish }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ close }}" style="position:fixed;inset:0;z-index:30;background:rgba(8,6,6,.7);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease">
      <div onClick="{{ stop }}" style="width:100%;max-width:440px;background:#1c1817;border-radius:28px 28px 0 0;animation:sheetUp .3s cubic-bezier(.2,.8,.3,1);max-height:90vh;overflow:auto;position:relative">
        <div style="{{ dish.imgStyle }}"></div>
        <div style="position:relative;margin-top:-46px;padding:0 22px 26px;display:flex;flex-direction:column;gap:14px">
          <div style="width:44px;height:4px;border-radius:999px;background:rgba(246,241,236,.5);margin:-24px auto 14px"></div>
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px">
            <h3 style="margin:0;font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.15">{{ dish.name }}</h3>
            <span style="font-family:Archivo, sans-serif;font-size:22px;font-weight:700;color:#ff7a5e;white-space:nowrap">{{ dish.price }}</span>
          </div>
          <p style="margin:0;font-size:15px;line-height:1.7;color:#cdc3bb;font-weight:300;text-wrap:pretty">{{ dish.long }}</p>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <sc-for list="{{ dish.facts }}" as="f" hint-placeholder-count="3">
              <span style="font-size:12px;border-radius:999px;background:rgba(246,241,236,.07);border:1px solid rgba(246,241,236,.12);padding:7px 13px;color:#cdc3bb">{{ f }}</span>
            </sc-for>
          </div>
          <div style="font-size:12px;color:#b3a79e;line-height:1.6;font-weight:300">{{ allergenLine }}</div>
          <button type="button" onClick="{{ close }}" style="appearance:none;cursor:pointer;border:0;background:#ec3013;color:#fff;border-radius:999px;font-family:Heebo, sans-serif;font-weight:600;font-size:16px;padding:17px;min-height:56px;box-shadow:0 10px 26px rgba(236,48,19,.3)" style-hover="background:#ff4a2b" style-active="background:#c72a10">{{ closeLabel }}</button>
        </div>
      </div>
    </div>
  </sc-if>

  <div style="position:sticky;bottom:0;z-index:15;background:linear-gradient(to top, #141110 60%, rgba(20,17,16,0));padding:18px;display:flex;align-items:center;justify-content:center;gap:8px">
    <span style="font-size:12px;color:#b3a79e;font-weight:300">{{ footerNote }}</span>
  </div>

</div>
</div>

</x-dc>

class Component extends DCLogic {
  state = { lang: null, cat: 'grill', splash: true, dishId: null };

  get lang() { return this.state.lang || this.props.defaultLang || 'he'; }

  renderVals() {
    const lang = this.lang, t = T[lang];
    const list = DATA[this.state.cat] || [];
    const stripes = 'background-color:#2a2422;background-image:repeating-linear-gradient(135deg,#332c29 0 6px,#2a2422 6px 12px);';
    const thumb = (id) => 'width:104px;height:104px;flex:none;border-radius:14px;overflow:hidden;' +
      (IMG[id] ? "background-image:url('" + encodeURI(IMG[id]) + "');background-size:cover;background-position:center;" : stripes);
    const hero = (id) => 'width:100%;aspect-ratio:16/10;border-radius:28px 28px 0 0;' +
      (IMG[id] ? "background-image:linear-gradient(to top, rgba(28,24,23,1) 2%, rgba(28,24,23,0) 55%), url('" + encodeURI(IMG[id]) + "');background-size:cover;background-position:center;" : stripes);
    const tagStyle = (kind) => {
      const base = 'font-size:11px;font-weight:500;border-radius:999px;padding:3px 9px;white-space:nowrap;';
      if (kind === 'hot') return base + 'background:rgba(236,48,19,.18);color:#ff8a70;border:1px solid rgba(236,48,19,.35)';
      if (kind === 'veg') return base + 'background:rgba(150,200,120,.14);color:#a8cf8a;border:1px solid rgba(150,200,120,.28)';
      return base + 'background:rgba(246,241,236,.07);color:#a2968e;border:1px solid rgba(246,241,236,.12)';
    };
    const found = DATA.starters.concat(DATA.grill, DATA.drinks).find(d => d.id === this.state.dishId);

    return {
      dir: t.dir,
      tableNo: this.props.tableNumber ?? '12',
      hours: t.hours,
      splashOpen: this.state.splash,
      splashLine: t.splash,
      langs: ['he','en','ar'].map(code => ({
        label: T[code].label,
        short: T[code].short,
        pick: () => this.setState({ lang: code, splash: false }),
        chipStyle: 'appearance:none;border:0;cursor:pointer;border-radius:999px;font-family:Heebo, sans-serif;font-weight:600;font-size:12px;padding:7px 11px;min-width:38px;' +
          (code === lang ? 'background:#ec3013;color:#fff' : 'background:transparent;color:#a2968e')
      })),
      cats: ['starters','grill','drinks'].map(k => ({
        label: t.cats[k],
        pick: () => this.setState({ cat: k }),
        tabStyle: 'appearance:none;cursor:pointer;white-space:nowrap;border-radius:999px;font-family:Heebo, sans-serif;font-weight:500;font-size:15px;padding:10px 20px;min-height:44px;transition:background .15s ease;' +
          (k === this.state.cat
            ? 'background:#f6f1ec;color:#141110;border:1px solid #f6f1ec;font-weight:700'
            : 'background:transparent;color:#a2968e;border:1px solid rgba(246,241,236,.16)')
      })),
      catTitle: t.titles[this.state.cat],
      catBlurb: t.blurbs[this.state.cat],
      dishes: list.map(d => ({
        name: d.name[lang], short: d.short[lang], price: '₪' + d.price,
        tag: d.tag[lang], tagStyle: tagStyle(d.kind), imgStyle: thumb(d.id),
        open: () => this.setState({ dishId: d.id })
      })),
      dish: found ? {
        name: found.name[lang], long: found.long[lang], price: '₪' + found.price,
        facts: found.facts[lang], imgStyle: hero(found.id)
      } : null,
      allergenLine: t.allergen,
      closeLabel: t.close,
      footerNote: t.footer,
      close: () => this.setState({ dishId: null }),
      stop: (e) => e.stopPropagation()
    };
  }
}
